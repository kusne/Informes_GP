<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151b23">
<title>Descargas de actas — Informes GP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#151b23;color:#f8fafc;font:16px Arial,sans-serif;min-height:100vh}
main{max-width:660px;margin:auto;padding:18px 14px 35px}
header{display:flex;align-items:center;gap:15px;margin-bottom:22px}
.logo{width:70px;height:70px;object-fit:contain}
h1{margin:0;font-size:25px;line-height:1.1;color:#fff}
.subtitulo{color:#d5dce7;margin:5px 0 0;font-size:14px}
.volver{display:inline-flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-weight:700;margin:3px 0 24px}
.volver:visited{color:#fff}
.volver:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:12px}
.volver-icono{display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#1476eb,#0645a9);box-shadow:inset 0 1px 2px #ffffff55,0 3px 9px #06152a77}
.volver-icono svg{width:31px;height:31px;display:block;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
section{border:1px solid #455164;background:#242d39;border-radius:16px;padding:18px}
label{display:block;font-weight:800;margin-bottom:9px}
input{width:100%;padding:14px 13px;border:2px solid #b9c5d6;border-radius:12px;background:#fff;color:#111827;font:inherit;font-size:17px}
input:focus{outline:3px solid #facc15;outline-offset:2px}
.contador{font-size:13px;color:#cad5e5;margin:15px 0 7px}
.item{border-top:1px solid #48566a;padding:16px 0}
.documento{display:flex;align-items:center;gap:15px}
.documento-info{min-width:0;flex:1}
.item h2{font-size:17px;color:#fff;margin:0;overflow-wrap:anywhere}
.icono-descarga{display:block;position:relative;flex:0 0 68px;width:68px;height:68px;border-radius:50%;background:linear-gradient(145deg,#0cb4f8,#13a5e8);box-shadow:inset 0 -2px 3px #078bc7,0 3px 8px #09121d66;transition:transform .15s,box-shadow .15s}
.icono-descarga::before{content:"";position:absolute;top:17px;left:18px;width:32px;height:30px;background:#fff;clip-path:polygon(26% 0,74% 0,74% 48%,100% 48%,50% 100%,0 48%,26% 48%);filter:drop-shadow(2px 2px 1px #086aa0)}
.icono-descarga::after{content:"";position:absolute;top:51px;left:19px;width:30px;height:5px;background:#fff;box-shadow:2px 2px 1px #0874a8}
.icono-descarga:hover{transform:translateY(-2px);box-shadow:inset 0 -2px 3px #078bc7,0 5px 12px #09121d88}
.icono-descarga:focus-visible{outline:3px solid #facc15;outline-offset:4px}
.detalles{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:#cad5e5;margin-top:6px}
.desc{color:#d6deea;font-size:13px;margin:6px 0 0;line-height:1.45}
#estado{color:#e0e8f2;margin:16px 0 0;line-height:1.45}
#estado.error{color:#fca5a5}
[hidden]{display:none!important}
@media(max-width:370px){.documento{gap:11px}.icono-descarga{flex-basis:58px;width:58px;height:58px}.icono-descarga::before{top:14px;left:15px;width:28px;height:27px}.icono-descarga::after{top:43px;left:16px;width:26px;height:4px}}
</style>
</head>
<body>
<main>
<a class="volver" href="./index.html"><span class="volver-icono" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M25 16H7M15 8l-8 8 8 8"/></svg></span><span>Volver a Informes GP</span></a>
<header>
<img class="logo" src="./frontend/assets/logo-bmzcn-white-vector.svg" alt="BMZCN">
<div><h1>DESCARGAS DE ACTAS</h1><p class="subtitulo">Brigada Motorizada Zona Centro Norte</p></div>
</header>
<section>
<label for="buscar">Buscar un acta o documento</label>
<input type="search" id="buscar" placeholder="Ej.: aprehensión, secuestro, víctima" autocomplete="off">
<p id="contador" class="contador"></p>
<div id="lista" aria-live="polite"></div>
<p id="estado" role="status">Cargando documentos…</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./descargas.js?v=20261020-solo-icono"></script>
</body>
</html>
