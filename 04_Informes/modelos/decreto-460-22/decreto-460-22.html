<section class="modelo-decreto">
  <h2>INFORME - DECTO 460/22</h2>

  <div class="modelo-decreto__ocr">
    <button type="button">LEER FOTO ACTA</button>
    <p>Opcional: use este botón antes de cargar los campos manuales.</p>
  </div>

  <div class="modelo-decreto__grid">
    <label>Marca <input type="text"></label>
    <label>Modelo <input type="text"></label>
    <label>Dominio <input type="text"></label>
    <label>N° de acta <input type="text"></label>
    <label>Código/s de infracción <input type="text" placeholder="Ej:  4084/ 9119"></label>
    <label>Destino / corralón <input type="text" placeholder="RINCON"></label>
    <label>Inventario <input type="checkbox" checked></label>
  </div>

  <p class="modelo-decreto__nota">
    El informe queda guardado como evento. No carga numerales automáticamente en el FINALIZADO.
  </p>

  <div id="fotosDecretoHost"></div>
</section>
