<section class="modelo-alcoholemia">
  <h2>INFORME - ALCOHOLEMIA</h2>

  <div class="modelo-alcoholemia__grid">
    <label>Tipo de vehículo <select><option>Seleccionar</option></select></label>
    <label>Marca <input type="text"></label>
    <label>Dominio <input type="text"></label>
    <label>Modelo <input type="text"></label>
    <label>Conductor <input type="text"></label>
    <label>Graduación g/l <input type="text" placeholder="0.51"></label>
    <label>Licencia Clase / DNI <input type="text" placeholder="B1 o DNI S/N"></label>
    <label>Digital <input type="checkbox"></label>
    <label>N° de acta <input type="text"></label>
    <label>Otros códigos <input type="text" placeholder="Ej: 9119 / 1301"></label>
  </div>

  <div class="modelo-alcoholemia__medidas">
    <strong>Medidas cautelares</strong>
    <label>Prohibición <input type="checkbox"></label>
    <label>Cesión <input type="checkbox"></label>
    <label>Remisión <input type="checkbox"></label>
    <label>Retención <input type="checkbox"></label>
  </div>

  <div id="fotosAlcoholemiaHost"></div>
</section>
