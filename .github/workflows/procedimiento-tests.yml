name: Blindaje de todos los informes GP
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contratos, arquitectura, módulos y regresiones completas
        run: npm run check:todo
      - name: Bloquear cambios a modelos no autorizados
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/main
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/verificar-alcance-informes.cjs
