  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  min-width: 170px;
  color: #003f8f;
  font-size: 18px;
  font-weight: 900;
  user-select: none;
}

.cmv-fuera-servicio input {
  width: 28px;
  height: 28px;
  accent-color: #003f8f;
}

.cmv-ayuda-wrap {
  position: absolute;
  right: 50%;
  top: -72px;
  transform: translateX(50%);
  z-index: 20;
}

.cmv-ayuda-btn {
  width: 52px;
  height: 52px;
  border: 3px solid #0056b8;
  border-radius: 999px;
  background: #fff;
  color: #0056b8;
  font-size: 32px;
  font-weight: 900;
  line-height: 1;
  box-shadow: 0 2px 8px rgba(0,0,0,.28);
  cursor: pointer;
}

.cmv-ayuda-btn.ayuda-activa {
  background: #0056b8;
  color: #fff;
}

.cmv-ayuda-popup {
  position: absolute;
  top: 62px;
  left: 50%;
  width: min(520px, calc(100vw - 34px));
  transform: translateX(-50%);
  padding: 18px 20px;
  border: 3px solid #0056b8;
  border-radius: 12px;
  background: #fff;
  color: #071022;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.35;
  box-shadow: 0 8px 18px rgba(0,0,0,.35);
}

.cmv-ayuda-popup::before {
  content: "";
  position: absolute;
  top: -15px;
  left: 50%;
  width: 26px;
  height: 26px;
  transform: translateX(-50%) rotate(45deg);
  border-left: 3px solid #0056b8;
  border-top: 3px solid #0056b8;
  background: #fff;
}

.cmv-ayuda-popup strong {
  display: block;
  color: #003f8f;
  margin-bottom: 14px;
}

.cmv-ayuda-popup p {
  margin: 0 0 12px;
}

.cmv-chips {
  display: grid;
  gap: 14px;
}

.cmv-grupo {
  padding: 14px;
  border: 2px solid #0056b8;
  border-radius: 16px;
  background: rgba(255,255,255,.22);
}

.cmv-grupo-titulo {
  margin: 0 0 12px;
  color: #003f8f;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .5px;
  text-transform: uppercase;
}

.cmv-grupo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px 14px;
}

.cmv-chip {
  min-height: 58px;
  padding: 8px 10px;
  border: 2px solid #9aa4b4;
  border-radius: 17px;
  background: #eef2f8;
  color: #071022;
  font-size: 28px;
  font-weight: 900;
  line-height: 1;
  box-shadow: 0 5px 10px rgba(0,0,0,.16);
  cursor: pointer;
}

.cmv-chip small {
  margin-left: 6px;
  font-size: 14px;
  font-weight: 900;
}

.cmv-chip:active,
.cmv-chip.cmv-chip-activo {
  background: #07116e;
  color: #fff;
  transform: translateY(1px);
}

.cmv-formulario {
  display: grid;
  gap: 10px;
}

.cmv-seleccionado {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 2px solid #0056b8;
  border-radius: 10px;
  background: #f6f8fb;
  color: #003f8f;
  font-size: 14px;
  font-weight: 900;
}

.cmv-seleccionado strong {
  color: #071022;
  font-size: 18px;
  font-weight: 900;
}

.cmv-form-grid,
.cmv-fotos {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.cmv-campo {
  display: grid;
  gap: 5px;
  color: #003f8f;
  font-size: 13px;
  font-weight: 900;
}

.cmv-campo input,
.cmv-campo select,
.cmv-campo textarea {
  width: 100%;
  min-height: 40px;
  padding: 8px 9px;
  border: 1px solid #aeb7c5;
  border-radius: 8px;
  background: #fff;
  color: #071022;
  font-size: 15px;
  font-weight: 700;
}

.cmv-campo textarea {
  resize: vertical;
  min-height: 88px;
}

.cmv-observaciones {
  grid-column: 1 / -1;
}

.cmv-preview {
  width: 100%;
  max-height: 120px;
  object-fit: cover;
  border: 1px solid #aeb7c5;
  border-radius: 8px;
}

.cmv-acciones {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 10px;
  margin-top: 2px;
}

.cmv-btn,
.cmv-salir {
  min-height: 48px;
  border: 0;
  border-radius: 10px;
  color: #fff;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}

.cmv-btn-secundario {
  background: #687385;
}

.cmv-btn-guardar {
  background: #c3142d;
}

.cmv-btn-guardar.guardando {
  background: #a75b72;
}

.cmv-salir {
  width: 100%;
  margin-top: 22px;
  background: #004cae;
}

.hidden,
.cmv-root .hidden {
  display: none !important;
}

@media (max-width: 520px) {
  .cmv-root {
    margin-top: 14px;
    padding: 12px;
    border-radius: 14px;
  }

  .cmv-title {
    font-size: 19px;
  }

  .cmv-estado {
    font-size: 14px;
  }

  .cmv-fuera-servicio {
    min-width: 140px;
    font-size: 16px;
  }

  .cmv-fuera-servicio input {
    width: 24px;
    height: 24px;
  }

  .cmv-grupo {
    padding: 12px;
  }

  .cmv-grupo-grid {
    gap: 10px;
  }

  .cmv-chip {
    min-height: 54px;
    font-size: 26px;
  }

  .cmv-chip small {
    font-size: 12px;
  }

  .cmv-form-grid,
  .cmv-fotos {
    grid-template-columns: 1fr 1fr;
  }

  .cmv-ayuda-popup {
    font-size: 20px;
  }
}

/* === FIN frontend/pantallas/control-moviles/control-moviles.css === */


:root {
  --bg-app: #2b2f36;
  --card-bg: #d7dce3;
  --card-bg-2: #c9d0da;

  --text: #0b1220;
  --text-2: #1f2937;

  --blue-strong: #0b3d91;
  --blue-strong-2: #072e6d;

  --border: #8e99a8;
  --danger: #b11a1a;

  --gold: #d4af37;
  --gold-2: #b8890a;

  --focus: rgba(11, 61, 145, 0.25);

  --radius-card: 14px;
  --radius-input: 12px;

  --check-scale: 1.35;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg-app);
  color: var(--text);
}

button,
select,
input,
textarea {
  font-family: inherit;
}

select,
input,
textarea {
  width: 100%;
  background: #eef1f6;
  border: 2px solid var(--border);
  border-radius: var(--radius-input);
  color: var(--text);
  outline: none;
}

select {
  min-height: 48px;
  padding: 8px 38px 8px 12px;
  font-size: 18px;
  font-weight: 800;
  color: var(--blue-strong);
}

input,
textarea {
  padding: 8px 10px;
  font-size: 15px;
  font-weight: 700;
}

textarea {
  min-height: 84px;
  resize: vertical;
}

select:focus,
input:focus,
textarea:focus {
  border-color: var(--blue-strong);
  box-shadow: 0 0 0 4px var(--focus);
}

.obligatorio {
  border: 3px solid var(--danger) !important;
}

.hidden {
  display: none !important;
}

button,
#btnEnviar,
.boton-enviar-whatsapp,
#botonEnviarWhatsappHost button {
  width: 100%;
  min-height: 50px;
  margin-top: 15px;
  padding: 12px;
  border: 0;
  border-radius: 14px;
  background: var(--blue-strong);
  color: #ffffff;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 0.3px;
  cursor: pointer;
  box-shadow: 0 14px 28px rgba(11, 61, 145, 0.30);
}

button:hover,
#btnEnviar:hover,
.boton-enviar-whatsapp:hover,
#botonEnviarWhatsappHost button:hover {
  background: var(--blue-strong-2);
}

button:active,
#btnEnviar:active,
.boton-enviar-whatsapp:active,
#botonEnviarWhatsappHost button:active {
  transform: translateY(1px);
}

label.check input[type="checkbox"],
.section input[type="checkbox"] {
  transform: scale(var(--check-scale));
}
