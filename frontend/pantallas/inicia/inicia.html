<form
  id="formularioIniciaUnificado"
  class="formulario-operativo formulario-inicia"
  data-formulario="inicio-unificado"
  data-tipo-operativo="GENERICO"
  novalidate
>
  <input type="hidden" name="personal" value="">
  <input type="hidden" name="moviles_motos" value="">
  <input type="hidden" name="elementos" value="">

  <div id="inicioPersonalPolicialHost"></div>
  <div id="inicioMovilidadHost"></div>
  <div id="inicioAgregarElementosPresenciaHost" class="hidden"></div>
  <div id="inicioElementosHost"></div>

  <section class="inicio-presencia-activa-card" aria-label="Presencia activa">
    <label for="inicioPresenciaActiva">
      <input id="inicioPresenciaActiva" name="presencia_activa" type="checkbox">
      <span>Presencia activa</span>
    </label>
    <div id="inicioPresenciaActivaMotivoWrap" class="hidden">
      <label for="inicioPresenciaActivaMotivo">Motivo:</label>
      <select id="inicioPresenciaActivaMotivo" name="presencia_activa_motivo">
        <option value="">Seleccionar motivo</option>
        <option value="LLUVIA">Lluvia</option>
        <option value="OTROS">Otros</option>
      </select>
      <div id="inicioPresenciaActivaOtroWrap" class="hidden">
        <label for="inicioPresenciaActivaOtro">Otro motivo:</label>
        <input id="inicioPresenciaActivaOtro" name="presencia_activa_otro" type="text" autocomplete="off" placeholder="Escriba el motivo">
      </div>
    </div>
  </section>

  <div class="inicio-observaciones">
    <label for="inicioObservaciones">Observaciones:</label>
    <textarea
      id="inicioObservaciones"
      name="observaciones"
      placeholder="Se realizó (01) verificación por animales sueltos&#10;o se realizó (01) Procedimiento Policial"
    ></textarea>
  </div>

</form>
