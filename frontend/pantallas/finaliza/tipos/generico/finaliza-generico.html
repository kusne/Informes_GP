<form class="formulario-operativo formulario-finaliza" data-formulario="finaliza-generico" data-tipo-operativo="GENERICO" data-foto-prefijo="finaliza-generico">
  <h2>FINALIZA - GENÉRICO</h2>
  <p>Formulario de finalización para operativo genérico.</p>

  <div class="bloque-formulario">
    <label for="finalizaActas-generico">Actas</label>
    <input id="finalizaActas-generico" name="actas" type="number" min="0" step="1" value="0">
  </div>

  <div class="bloque-formulario">
    <label for="finalizaPersonas-generico">Personas identificadas</label>
    <input id="finalizaPersonas-generico" name="personas" type="number" min="0" step="1" value="0">
  </div>

  <div class="bloque-formulario">
    <label for="finalizaVehiculos-generico">Vehículos controlados</label>
    <input id="finalizaVehiculos-generico" name="vehiculos" type="number" min="0" step="1" value="0">
  </div>

  <div data-numerales-finaliza-host></div>

  <div class="bloque-formulario">
    <label for="finalizaObservaciones-generico">Observaciones</label>
    <textarea id="finalizaObservaciones-generico" name="observaciones" placeholder="Observaciones de la finalización"></textarea>
  </div>

  <div class="fotos-formulario-host" data-fotos-html="/frontend/pantallas/finaliza/tipos/generico/fotos/fotos-finaliza-generico.html" data-fotos-module="/frontend/pantallas/finaliza/tipos/generico/fotos/fotos-finaliza-generico.js"></div>
</form>
