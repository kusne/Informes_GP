    <label for="finalizaActas-ocv">Actas</label>
    <input id="finalizaActas-ocv" name="actas" type="number" min="0" step="1" value="0">
  </div>

  <div class="bloque-formulario">
    <label for="finalizaPersonas-ocv">Personas identificadas</label>
    <input id="finalizaPersonas-ocv" name="personas" type="number" min="0" step="1" value="0">
  </div>

  <div class="bloque-formulario">
    <label for="finalizaVehiculos-ocv">Vehículos controlados</label>
    <input id="finalizaVehiculos-ocv" name="vehiculos" type="number" min="0" step="1" value="0">

  <div class="bloque-formulario">
