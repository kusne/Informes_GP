<section class="archivos-numerales" data-archivos-numerales>
  <h3>Numerales / Detalles</h3>

  <div class="bloque-formulario">
    <label for="numeralesTextoEntrada">Códigos / numerales</label>
    <textarea
      id="numeralesTextoEntrada"
      name="numerales_texto"
      placeholder="Ej: 1301 2&#10;9119 1&#10;Otros códigos o detalles"
    ></textarea>
  </div>

  <div class="bloque-formulario">
    <label for="numeralesResumenSalida">Resumen detectado</label>
    <textarea
      id="numeralesResumenSalida"
      name="numerales_resumen"
      readonly
      placeholder="El resumen se arma automáticamente"
    ></textarea>
  </div>

  <input type="hidden" id="numeralesItemsJson" name="numerales_items_json" value="[]">
</section>
