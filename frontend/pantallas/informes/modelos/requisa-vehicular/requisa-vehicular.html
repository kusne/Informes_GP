<section class="formulario-informe-especial" data-modelo-informe="REQUISA_VEHICULAR">
  <h2>REQUISA VEHICULAR</h2>
  <p>Informe de requisa vehicular vinculado al operativo seleccionado.</p>

  <!-- Contexto del operativo: se completa automáticamente y no se edita. -->
  <input id="requisaFecha" name="fecha_hecho" type="hidden" data-contexto-operativo="fecha">
  <input id="requisaHora" name="hora_hecho" type="hidden" data-contexto-operativo="hora">
  <input id="requisaLugar" name="lugar_hecho" type="hidden" data-contexto-operativo="lugar">
  <input id="requisaPersonal" name="personal" type="hidden" data-contexto-operativo="personal">
  <input id="requisaMoviles" name="moviles" type="hidden" data-contexto-operativo="moviles">
  <input id="requisaElementos" name="elementos" type="hidden" data-contexto-operativo="elementos">

  <div class="grilla-doble">
    <div class="bloque-formulario">
      <label for="requisaDepartamento">Departamento</label>
      <input id="requisaDepartamento" name="departamento" type="text" value="La Capital" placeholder="Departamento">
    </div>
    <div class="bloque-formulario">
      <label for="requisaTalonario">Talonario</label>
      <select id="requisaTalonario" name="talonario">
        <option value="NO" selected>No</option>
        <option value="SI">Sí</option>
      </select>
    </div>
  </div>

  <div class="grilla-doble">
    <div class="bloque-formulario">
      <label for="requisaAlometro">Alómetro</label>
      <input id="requisaAlometro" name="alometro" type="text" placeholder="Ej: 0127">
    </div>
    <div class="bloque-formulario">
      <label for="requisaAlcoholimetro">Alcoholímetro</label>
      <input id="requisaAlcoholimetro" name="alcoholimetro" type="text" placeholder="Ej: 0732">
    </div>
  </div>

  <div class="grilla-doble">
    <div class="bloque-formulario">
      <label for="requisaImpresora">Impresora</label>
      <input id="requisaImpresora" name="impresora" type="text" placeholder="Ej: N° 39/64">
    </div>
    <div class="bloque-formulario">
      <label for="requisaPda">PDA</label>
      <input id="requisaPda" name="pda" type="text" placeholder="Ej: N 67, 68, 05, 19">
    </div>
  </div>

  <div class="grilla-doble">
    <div class="bloque-formulario">
      <label for="requisaHt">HT</label>
      <input id="requisaHt" name="ht" type="text" placeholder="Ej: N° 02/06">
    </div>
    <div class="bloque-formulario">
      <label for="requisaEscopeta">Escopeta</label>
      <input id="requisaEscopeta" name="escopeta" type="text" placeholder="Ej: N° 650367">
    </div>
  </div>

  <div class="bloque-formulario">
    <label for="requisaObservaciones">Observaciones</label>
    <textarea id="requisaObservaciones" name="observaciones" placeholder="Relato de la requisa vehicular"></textarea>
  </div>

</section>
