<section class="formulario-informe-especial" data-modelo-informe="ALCOHOLEMIA_POSITIVA" data-foto-prefijo="alcoholemia-positiva">
  <h2>ALCOHOLEMIA POSITIVA</h2>
  <p>Informe especial de alcoholemia positiva vinculado al operativo seleccionado.</p>

  <div class="grilla-doble">
    <div class="bloque-formulario">
      <label for="alcoConductor">Conductor</label>
      <input id="alcoConductor" name="conductor" type="text" placeholder="Apellido y nombre">
    </div>

    <div class="bloque-formulario">
      <label for="alcoDni">DNI</label>
      <input id="alcoDni" name="dni" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="DNI">
    </div>
  </div>

  <div class="grilla-doble">
    <div class="bloque-formulario">
      <label for="alcoDominio">Dominio</label>
      <input id="alcoDominio" name="dominio" type="text" placeholder="Patente / dominio">
    </div>

    <div class="bloque-formulario">
      <label for="alcoTipoVehiculo">Tipo de vehículo</label>
      <select id="alcoTipoVehiculo" name="tipo_vehiculo">
        <option value="">Seleccionar</option>
        <option value="MOTO">MOTO</option>
        <option value="AUTO">AUTO</option>
        <option value="SEDAN">SEDAN</option>
        <option value="CAMIONETA">CAMIONETA / PICK UP</option>
        <option value="CAMION">CAMIÓN</option>
        <option value="TRANSPORTE">TRANSPORTE</option>
        <option value="CHASIS">CHASIS</option>
        <option value="TRACTOR">TRACTOR</option>
        <option value="CARRETON">CARRETÓN</option>
      </select>
    </div>
  </div>

  <div class="grilla-doble">
    <div class="bloque-formulario">
      <label for="alcoResultado">Resultado</label>
      <input id="alcoResultado" name="resultado" type="number" min="0" step="0.01" placeholder="Ej: 0.65">
    </div>

    <div class="bloque-formulario">
      <label for="alcoClase">Clase / DNI sin licencia</label>
      <input id="alcoClase" name="clase" type="text" placeholder="Clase o DNI si no posee licencia">
    </div>
  </div>

  <div class="bloque-formulario checkbox-linea">
    <input id="alcoLicenciaDigital" name="licencia_digital" type="checkbox" value="SI">
    <label for="alcoLicenciaDigital">Posee licencia digital</label>
  </div>

  <div class="bloque-formulario checkbox-linea">
    <input id="alcoCon460" name="con_decreto_460_22" type="checkbox" value="SI">
    <label for="alcoCon460">También corresponde Decreto 460/22</label>
  </div>

  <div class="bloque-formulario">
    <label for="alcoObservaciones">Observaciones</label>
    <textarea id="alcoObservaciones" name="observaciones" placeholder="Observaciones adicionales"></textarea>
  </div>

  <div class="fotos-formulario-host"
       data-fotos-html="/frontend/pantallas/informes/modelos/alcoholemia-positiva/fotos/fotos-alcoholemia-positiva.html"
       data-fotos-module="/frontend/pantallas/informes/modelos/alcoholemia-positiva/fotos/fotos-alcoholemia-positiva.js"></div>
</section>
