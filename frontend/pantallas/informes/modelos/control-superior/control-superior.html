<section class="formulario-informe-especial" data-modelo-informe="CONTROL_SUPERIOR">
  <h2>CONTROL SUPERIOR</h2>
  <p>Informe especial vinculado al operativo seleccionado.</p>

  <div class="bloque-formulario">
    <span class="etiqueta-campo" style="font-size: 15px;">AUTORIDAD</span>
    <div class="opciones-en-linea opciones-control-superior" role="group" aria-label="Autoridad">
      <label class="checkbox-opcion"><input id="controlSuperiorJefe" name="autoridad_jefe" type="checkbox" value="SI"> Jefe</label>
      <label class="checkbox-opcion"><input id="controlSuperiorSubjefe" name="autoridad_subjefe" type="checkbox" value="SI"> Subjefe</label>
      <label class="checkbox-opcion"><input id="controlSuperiorOtros" name="autoridad_otros" type="checkbox" value="SI"> Otros</label>
    </div>
  </div>

  <div class="bloque-formulario" id="controlSuperiorNombreBloque" hidden>
    <label for="controlSuperiorNombre">Nombre / cargo</label>
    <input id="controlSuperiorNombre" name="nombre_autoridad" type="text" placeholder="Nombre y cargo de la autoridad">
  </div>

  <div class="bloque-formulario">
    <span class="etiqueta-campo" style="font-size: 15px;">MÓVIL/ES</span>
    <div class="opciones-en-linea opciones-control-superior" role="group" aria-label="Móviles">
      <label class="checkbox-opcion"><input id="controlSuperiorMovil12428" name="movil_12428" type="checkbox" value="SI" checked> M/12428</label>
      <label class="checkbox-opcion"><input id="controlSuperiorMovilOtro" name="movil_otro" type="checkbox" value="SI"> Otro</label>
    </div>
    <label class="checkbox-opcion" style="margin-top: 12px !important;"><input id="controlSuperiorSeAcopla" name="se_acopla" type="checkbox" value="SI" checked> SE ACOPLA</label>
  </div>

  <div class="bloque-formulario" id="controlSuperiorMovilOtroBloque" hidden>
    <label for="controlSuperiorMovilesOtros">Otro/s móvil/es</label>
    <input id="controlSuperiorMovilesOtros" name="moviles_otros" type="text" placeholder="Ej: 12502/10139">
  </div>
</section>
